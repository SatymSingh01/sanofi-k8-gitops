apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub
  namespace: myredhat0101-dev
  labels:
    app: hub
spec:
  replicas: 4
  selector:
    matchLabels:
      app: hub
  template:
    metadata:
      labels:
        app: hub
    spec:
      containers:
        - name: hub
          image: ghcr.io/satymsingh01/hub:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: AppOne__BaseUrl
              value: "http://app-one:8080"
            - name: AuthSite__BaseUrl
              value: "http://auth-site:8080"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
